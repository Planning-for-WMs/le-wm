# RDMReg p=1, μ=0 baseline trained at img_size=224 (native resolution of
# pusht_expert_train.h5 — no upscaling from the 112 LMDB). Goal: see if
# training at eval-matched resolution unlocks the paper-claimed higher
# success rates. The 112-trained mu=0 run peaked at 60%.

defaults:
  - _self_
  - data: pusht_expert_lmdb_224

use_lmdb: true

output_model_name: lewm_lp_p1.0_mu0_pusht_expert_224
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 2
  pin_memory: False

optimizer:
  type: AdamW
  lr: 2e-4
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    entity: wms_at_iitb
    project: le-wm
    name: ${output_model_name}
    id: lewm_lp_p1.0_mu0_pusht_expert_224_v1
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  rdmreg:
    weight: 1.0
    kwargs:
      p: 1.0
      mu: 0.0
      num_proj: 8192
