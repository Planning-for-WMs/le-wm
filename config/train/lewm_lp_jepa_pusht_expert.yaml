defaults:
  - _self_
  - data: pusht_expert_lmdb

# Tell train_lp_jepa.py to load via LMDBDataset instead of HDF5Dataset.
use_lmdb: true

output_model_name: lewm_lp_p${loss.rdmreg.kwargs.p}_pusht_expert
subdir: ${hydra:job.id}

num_workers: 10
train_split: 0.9
seed: 3072
img_size: 112
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 512
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 4
  pin_memory: True

optimizer:
  type: AdamW
  lr: 2e-4
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    entity: wms_at_iitb
    project: le-wm
    name: ${output_model_name}
    id: lewm_lp_pusht_expert_v1
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  rdmreg:
    weight: 1.0
    kwargs:
      p: 1.0
      num_proj: 8192
