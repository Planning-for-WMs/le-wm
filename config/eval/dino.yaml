defaults:
  - solver: cem
  - _self_

# Path to the DINO-WM PushT checkpoint (downloaded from OSF)
checkpoint: ${hydra:runtime.cwd}/hierarchical/ckpt/outputs/pusht/checkpoints/model_latest.pth

# ToMe configuration
tome:
  r: 0  # tokens to merge per predictor layer (set 0 to disable)

# Dataset (recorded with WeakPolicy at 224x224, 50 episodes x 50 steps each)
dataset:
  name: pusht_50steps
  cache_dir: ${hydra:runtime.cwd}/dataset

env:
  name: swm/PushT-v1
  img_size: 224
  max_episode_steps: 100  # >= eval.eval_budget

seed: 40

# Closed-loop MPC settings.
# frameskip = action_block = 5  (DINO-WM was trained with frameskip 5).
# horizon = 5 plan steps  = 25 env steps lookahead.
# receding_horizon = 2 plan steps = 10 env steps executed before replan.
plan_config:
  horizon: 10
  receding_horizon: 5
  action_block: 5
  history_len: 3
  warm_start: false

eval:
  num_eval: 5
  eval_budget: 50           # env steps per episode
  goal_offset_steps: 50     # frames into the source episode to use as goal
  success_threshold: 0.98   # block-coverage IoU
  save_videos: true

output:
  filename: dino_results.txt
  video_dir: ${hydra:runtime.cwd}/hierarchical/viz/eval
